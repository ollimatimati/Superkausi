<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Superkausi">
<title>LIIGA: SUPERKAUSI – TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d9e2ea; --fg:#0e1a2b; --muted:#4d5f75; --chip:#ffffff; --chip-fg:#0e1a2b;
  --blue:#1f6feb; --red:#e0302f; --gold:#ffc629; --night:#0b1424;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#060b14; --fg:#e8eef5; --muted:#8fa2b8; --chip:#14213a; --chip-fg:#e8eef5; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#060b14; --fg:#e8eef5; --muted:#8fa2b8; --chip:#14213a; --chip-fg:#e8eef5; color-scheme:dark; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; height:100%; background:var(--bg); color:var(--fg);
  font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; overflow:hidden;
}
#wrap{
  position:relative; width:min(100%, calc((100dvh - 64px) * 16 / 9));
  aspect-ratio:16/9; container-type:inline-size; border-radius:12px; overflow:hidden;
  background:var(--night); box-shadow:0 10px 40px rgba(0,0,0,.35);
}
canvas{ display:block; width:100%; height:100%; }
#wrap > canvas{ position:absolute; inset:0; }
#game{ background:transparent; }
.overlay{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; color:#f4f8fb; padding:3cqw;
  background:radial-gradient(ellipse at 50% 45%, rgba(6,11,20,.62), rgba(6,11,20,.9));
}
.hidden{ display:none !important; }
.title{ font-family:"Bungee",Impact,"Arial Black",sans-serif; line-height:.92; margin:0; transform:rotate(-3deg); }
.title .l1{ display:block; font-size:5.2cqw; color:var(--gold); letter-spacing:.04em; }
.title .l2{ display:block; font-size:7cqw; color:#fff; text-shadow:.35cqw .35cqw 0 var(--red), -.35cqw -.35cqw 0 var(--blue); }
.lede{ max-width:60ch; font-size:1.8cqw; line-height:1.35; color:#c9d6e4; margin:1.8cqw 0 0; }
.btn{
  font-family:"Bungee",Impact,"Arial Black",sans-serif; font-size:2.2cqw; border:0; cursor:pointer;
  padding:1cqw 3cqw; border-radius:999px; background:var(--gold); color:#1a1300;
  box-shadow:0 .5cqw 0 #b88a00; transition:transform .08s;
}
.btn:active{ transform:translateY(.4cqw); box-shadow:0 .1cqw 0 #b88a00; }
.btn.big{ font-size:3.4cqw; padding:1.1cqw 5cqw; }
.btn.ghost{ background:transparent; color:#fff; box-shadow:inset 0 0 0 .25cqw #fff; }
.btn:focus-visible, .seg button:focus-visible{ outline:.3cqw solid #fff; outline-offset:.3cqw; }
.seg{ display:flex; gap:.6cqw; margin:0 0 1.8cqw; }
.seg button{
  font-family:"Barlow Condensed",sans-serif; font-weight:800; font-size:1.9cqw; cursor:pointer;
  padding:.5cqw 1.8cqw; border-radius:999px; border:.2cqw solid #5d7392; background:transparent; color:#dfe8f2;
}
.seg button.on{ background:#fff; color:#0b1424; border-color:#fff; }
.keys{ display:flex; flex-wrap:wrap; justify-content:center; gap:.6cqw 1.8cqw; margin-top:2cqw; font-size:1.7cqw; color:#c9d6e4; }
kbd{
  font-family:"Barlow Condensed",sans-serif; font-weight:800; display:inline-block; min-width:2.2cqw;
  padding:.1cqw .7cqw; border-radius:.5cqw; background:#f4f8fb; color:#0b1424; box-shadow:0 .25cqw 0 #8aa0b8; margin-right:.3cqw;
}
.result{ font-family:"Bungee",Impact,sans-serif; font-size:7cqw; margin:0; line-height:1; }
.final{ font-family:"Bungee",Impact,sans-serif; font-size:4.4cqw; margin:.8cqw 0 1.4cqw; }
.final .b{ color:#5aa2ff; } .final .r{ color:#ff6b6a; }
.happen{ list-style:none; padding:0; margin:0 0 1.4cqw; font-size:1.35cqw; line-height:1.4; color:#dfe8f2; max-width:90cqw; columns:2; column-gap:3cqw; text-align:left; }
.happen li{ break-inside:avoid; }
.happen li::before{ content:"⚡ "; }
.row{ display:flex; gap:1.6cqw; }
#bar{
  width:min(100%, calc((100dvh - 64px) * 16 / 9)); display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:0 4px; font-size:15px; color:var(--muted); flex-wrap:wrap;
}
#bar .k{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
#bar kbd{ font-size:13px; min-width:0; padding:1px 6px; border-radius:4px; background:var(--chip); color:var(--chip-fg); box-shadow:0 2px 0 rgba(0,0,0,.25); }
#bar button{
  font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:15px; cursor:pointer;
  border:1px solid var(--muted); background:transparent; color:var(--fg); border-radius:999px; padding:3px 12px;
}
#touch{ position:absolute; inset:0; pointer-events:none; }
/* phones and tablets: no key help under the game, the game uses the whole screen height; mute and pause sit in the corner */
html.touch body{ gap:0; background:#000; }
html.touch #bar{ display:none; }
html.touch #wrap{ width:min(100vw, calc(100dvh * 16 / 9)); border-radius:0; box-shadow:none; }
#tTop{ position:absolute; top:1.2cqw; right:1.4cqw; display:flex; gap:1cqw; pointer-events:auto; }
#tTop button{ width:5.4cqw; height:5.4cqw; border-radius:50%; border:0; background:rgba(11,20,36,.72); color:#fff; font-family:"Bungee",sans-serif; font-size:1.6cqw; touch-action:none; }
#tTop button.off{ color:#ff6b6a; }
#stick{ position:absolute; left:2cqw; bottom:3cqw; width:16cqw; height:16cqw; border-radius:50%; background:rgba(255,255,255,.12); border:.3cqw solid rgba(255,255,255,.35); pointer-events:auto; touch-action:none; }
#knob{ position:absolute; left:50%; top:50%; width:6cqw; height:6cqw; margin:-3cqw 0 0 -3cqw; border-radius:50%; background:rgba(255,255,255,.7); }
#tbtns{ position:absolute; right:2cqw; bottom:3cqw; display:flex; gap:1.4cqw; pointer-events:auto; }
#tbtns button{ width:8.4cqw; height:8.4cqw; border-radius:50%; border:0; font-family:"Bungee",sans-serif; font-size:1.5cqw; color:#0b1424; background:rgba(255,255,255,.8); touch-action:none; }
#tbtns button.k{ background:var(--gold); }
#tbtns button.d{ font-size:1.15cqw; background:#ffe7a3; }
.note{ font-size:1.7cqw; color:#c9d6e4; margin:0 0 1.2cqw; }
.result.small{ font-size:4.4cqw; }
.final.small{ font-size:2.4cqw; margin:.4cqw 0 1.2cqw; }
.lede.tight{ margin:.6cqw 0 1cqw; font-size:1.7cqw; }
.tbl{ border-collapse:collapse; font-size:1.75cqw; margin:0 0 1.2cqw; min-width:38cqw; }
.tbl td,.tbl th{ padding:.2cqw 1.2cqw; text-align:center; border-bottom:.1cqw solid rgba(255,255,255,.15); }
.tbl th{ color:#8fa2b8; font-weight:700; }
.tbl td.l{ text-align:left; }
.tbl .b{ color:#5aa2ff; font-weight:800; } .tbl .r{ color:#ff6b6a; font-weight:800; }
.tbl tr.next td{ color:#ffc629; }
.tbl tr.sum td{ font-weight:800; border-bottom:0; }
.settings{ margin:0 0 1.8cqw; }
.settings button{ font-size:1.55cqw; }
#modeSeg{ margin-top:1.2cqw; }
.logo{ width:9cqw; height:auto; margin-bottom:-.6cqw; filter:drop-shadow(0 .4cqw .6cqw rgba(0,0,0,.5)); }
.overlay:not(.hidden){ animation:ovIn .35s ease both; }
@keyframes ovIn{ from{ opacity:0; transform:scale(1.03); } to{ opacity:1; transform:none; } }
.title{ animation:bob 4.5s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:rotate(-3deg) translateY(0); } 50%{ transform:rotate(-2deg) translateY(-.4cqw); } }
@media (prefers-reduced-motion: reduce){ .overlay:not(.hidden), .title{ animation:none; } }
.cols{ display:flex; gap:3cqw; align-items:flex-start; }
.teamrow{ display:flex; align-items:center; gap:1.2cqw; margin:0 0 1.4cqw; }
.teamrow .vs{ font-family:"Bungee",sans-serif; font-size:1.6cqw; color:#c9d6e4; }
.tchip{ display:flex; align-items:center; gap:.8cqw; cursor:pointer; padding:.4cqw 1.4cqw .4cqw .6cqw; border-radius:999px; border:.2cqw solid #5d7392; background:rgba(8,14,26,.6); color:#fff; font-family:"Barlow Condensed",sans-serif; font-weight:800; font-size:1.7cqw; }
.tchip:hover, .tbtn:hover{ border-color:#fff; }
.tchip:focus-visible, .tbtn:focus-visible{ outline:.3cqw solid #fff; outline-offset:.3cqw; }
.jer{ display:inline-block; width:2.8cqw; height:2.8cqw; background:linear-gradient(180deg, var(--j) 0 50%, var(--t) 50% 62%, var(--j) 62%); clip-path:polygon(26% 0,40% 7%,60% 7%,74% 0,100% 19%,89% 41%,78% 34%,78% 100%,22% 100%,22% 34%,11% 41%,0 19%); filter:drop-shadow(0 0 .08cqw rgba(255,255,255,.9)) drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.5)); }
.tgrid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:.5cqw; margin:.6cqw 0 1cqw; }
.tbtn{ display:flex; flex-direction:column; align-items:center; gap:.2cqw; cursor:pointer; padding:.6cqw .4cqw; border-radius:.8cqw; border:.2cqw solid transparent; background:rgba(8,14,26,.55); color:#fff; font-family:"Barlow Condensed",sans-serif; }
.tbtn .jer{ width:3.6cqw; height:3.6cqw; }
#tpick .result.small{ font-size:3.2cqw; }
#tpick .tbtn{ padding:.35cqw .3cqw; }
.overlay{ overflow-y:auto; justify-content:flex-start; }
.overlay > :first-child{ margin-top:auto; }
.overlay > :last-child{ margin-bottom:auto; }
.tbtn b{ font-size:1.5cqw; font-weight:800; } .tbtn small{ font-size:1.2cqw; color:#c9d6e4; }
.tbtn.on{ border-color:#ffc629; background:rgba(255,198,41,.15); }
.cols .tbl{ min-width:0; }
.tcard{ display:flex; gap:1cqw; margin:-.6cqw 0 1.4cqw; font-size:1.45cqw; color:#dfe8f2; }
.tcard .pc{ background:rgba(8,14,26,.7); border:.15cqw solid #33476a; border-radius:.8cqw; padding:.5cqw 1cqw; min-width:14cqw; text-align:left; }
.tcard .pc b{ font-size:1.6cqw; } .tcard .pc .o{ float:right; margin-left:.8cqw; font-family:"Bungee",sans-serif; color:#ffc629; }
.tcard .pc .bars{ display:grid; grid-template-columns:auto 1fr; gap:.1cqw .5cqw; align-items:center; margin-top:.3cqw; font-size:1.15cqw; color:#8fa2b8; }
.tcard .pc .bars i{ display:block; height:.5cqw; border-radius:.3cqw; background:linear-gradient(90deg,#ffc629 var(--v),rgba(255,255,255,.12) var(--v)); }
.tbtn .lv{ font-family:"Bungee",sans-serif; font-size:1.1cqw; color:#ffc629; }
#seasonBody{ display:flex; gap:2cqw; align-items:flex-start; justify-content:center; margin:0 0 .6cqw; }
#seasonBody .tbl{ font-size:1.32cqw; margin:0; min-width:0; }
#seasonBody .tbl td, #seasonBody .tbl th{ padding:.08cqw .6cqw; }
#seasonBody h4{ margin:0 0 .4cqw; font-size:1.5cqw; color:#ffc629; }
.tbl tr.me td{ color:#ffc629; font-weight:800; }
#seasonBody .tbl .jer{ width:1.5cqw; height:1.5cqw; vertical-align:middle; margin-right:.3cqw; }
.tbl tr.cut td{ border-bottom:.2cqw solid #ffc629; }
.gh{ display:inline-block; width:1cqw; height:1cqw; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fff3b0, #e3b21c 55%, #8a6400); margin-left:.4cqw; vertical-align:middle; }
.achgrid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:.7cqw; margin:0 0 2cqw; width:100%; max-width:92cqw; }
.ach{ display:flex; gap:.8cqw; align-items:center; text-align:left; padding:.6cqw 1cqw; border-radius:1cqw; border:.15cqw solid #33465f; opacity:.45; }
.ach.got{ opacity:1; border-color:#ffc629; background:rgba(255,198,41,.08); }
.ach .ai, #achToast .ai{ flex:none; line-height:0; } .medal{ width:2.8cqw; height:3.36cqw; } #achToast .medal{ width:3.4cqw; height:4.1cqw; }
.ach.got.t1{ border-color:#c98a52; background:rgba(201,138,82,.08); } .ach.got.t2{ border-color:#c9d3de; background:rgba(201,211,222,.07); }
.ach b{ display:block; font-size:1.6cqw; color:#fff; } .ach em{ display:block; font-style:normal; font-size:1.25cqw; color:#a9b8ca; }
#achToast{ position:absolute; left:50%; top:1.2cqw; transform:translate(-50%, -160%); z-index:80; display:flex; gap:1cqw; align-items:center; padding:.8cqw 1.6cqw; border-radius:1.2cqw; background:#0b1424; border:.25cqw solid #ffc629; box-shadow:0 .6cqw 2cqw rgba(0,0,0,.5); transition:transform .4s cubic-bezier(.2,1.4,.4,1); pointer-events:none; text-align:left; }
#achToast.show{ transform:translate(-50%, 0); }
#achToast small{ display:block; font-size:1.05cqw; letter-spacing:.1em; color:#ffc629; font-weight:800; } #achToast b{ display:block; font-size:1.9cqw; color:#fff; } #achToast em{ display:block; font-style:normal; font-size:1.25cqw; color:#c9d6e4; }
.pfull .achgrid{ grid-template-columns:repeat(2, 1fr); gap:1.6vw; max-width:none; } .pfull .ach{ padding:1.4vw 2vw; border-radius:2vw; gap:2vw; } .pfull .ach .medal{ width:7vw; height:8.4vw; } .pfull .ach b{ font-size:3.5vw; } .pfull .ach em{ font-size:2.8vw; } .pfull #achCount{ font-size:3.6vw; }
.evgrid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:.7cqw; margin:0 0 2cqw; }
.evgrid button{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:1.6cqw; cursor:pointer; padding:.5cqw 1.4cqw; border-radius:999px; border:.2cqw solid #5d7392; background:transparent; color:#8fa2b8; text-decoration:line-through; }
.evgrid button.on{ background:#fff; color:#0b1424; border-color:#fff; text-decoration:none; }
.evgrid button:focus-visible{ outline:.3cqw solid #fff; outline-offset:.3cqw; }
@media (prefers-reduced-motion: reduce){ .btn{ transition:none; } }
/* portrait phones: the team picker and the season screen leave the tiny 16:9 box and fill the screen */
.overlay.pfull{ position:fixed; inset:0; z-index:60; padding:5vw 3.5vw calc(6vw + env(safe-area-inset-bottom, 0px)); background:#0b1424; }
.pfull .result.small, #tpick.pfull .result.small{ font-size:7vw; }
.pfull .btn{ font-size:4.4vw; padding:2.2vw 5vw; box-shadow:0 1.2vw 0 #b88a00; }
.pfull .btn.ghost{ box-shadow:inset 0 0 0 .6vw #fff; }
.pfull .row{ gap:3vw; flex-wrap:wrap; justify-content:center; }
.pfull .seg{ gap:1.5vw; flex-wrap:wrap; justify-content:center; margin:2vw 0 3vw; }
.pfull .seg button{ font-size:3.6vw; padding:1.2vw 3vw; border-width:.5vw; }
.pfull .tgrid{ grid-template-columns:repeat(6, 1fr); gap:1.4vw; margin:1vw 0 2vw; width:100%; }
.pfull .tbtn small{ display:none; }
.pfull #tpName{ font-size:4.2vw; margin:0 0 2vw; color:#fff; font-weight:800; }
.pfull .tbtn{ padding:1.4vw .8vw; border-radius:2vw; border-width:.5vw; gap:.6vw; }
.pfull .tbtn .jer{ width:8vw; height:8vw; }
.pfull .tbtn b{ font-size:3.6vw; } .pfull .tbtn small{ font-size:2.7vw; } .pfull .tbtn .lv{ font-size:2.8vw; }
.pfull .tcard{ flex-wrap:wrap; justify-content:center; gap:2vw; margin:0 0 3vw; font-size:3vw; }
.pfull .tcard .pc{ min-width:44vw; padding:1.4vw 2.2vw; border-radius:2vw; border-width:.4vw; }
.pfull .tcard .pc b{ font-size:3.4vw; } .pfull .tcard .pc .bars{ font-size:2.6vw; gap:.4vw 1.4vw; margin-top:1vw; } .pfull .tcard .pc .bars i{ height:1.3vw; border-radius:1vw; }
.pfull #seasonBody{ flex-direction:column; align-items:stretch; gap:3vw; width:100%; }
.pfull #seasonBody .tbl{ font-size:2.9vw; width:100%; } .pfull #seasonBody .tbl td, .pfull #seasonBody .tbl th{ padding:.5vw 1vw; }
.pfull #seasonBody h4{ font-size:3.6vw; margin:0 0 1vw; } .pfull #seasonBody .tbl .jer{ width:3.6vw; height:3.6vw; } .pfull .gh{ width:2.4vw; height:2.4vw; }
.pfull .final.small{ font-size:4.4vw; margin:2vw 0 3vw; }
</style>
</head>
<body>
<div id="wrap">
  <div id="achToast" role="status" aria-live="polite"></div>
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="game" width="1280" height="720" aria-label="Jääkiekko-ottelu"></canvas>

  <div id="touch" class="hidden">
    <div id="tTop"><button id="tMute" aria-label="Äänet">ÄÄNI</button><button id="tPause" aria-label="Tauko">II</button></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="tbtns">
      <button id="tDeke" class="d">HARHAUTA</button>
      <button id="tCheck">TAKLAA</button>
      <button id="tPass">SYÖTÄ</button>
      <button id="tShoot" class="k">LAUO</button>
    </div>
  </div>

  <div id="menu" class="overlay">
    <svg class="logo" viewBox="0 0 120 64" aria-hidden="true">
      <g stroke-linecap="round"><line x1="22" y1="6" x2="78" y2="54" stroke="#e3c18a" stroke-width="6"/><line x1="98" y1="6" x2="42" y2="54" stroke="#e3c18a" stroke-width="6"/>
      <line x1="70" y1="50" x2="86" y2="52" stroke="#111" stroke-width="7"/><line x1="50" y1="50" x2="34" y2="52" stroke="#111" stroke-width="7"/></g>
      <ellipse cx="60" cy="50" rx="14" ry="6" fill="#111"/><rect x="46" y="44" width="28" height="6" fill="#111"/><ellipse cx="60" cy="44" rx="14" ry="6" fill="#2a2a2a" stroke="#ffc629" stroke-width="1.5"/>
    </svg>
    <h1 class="title"><span class="l1">LIIGA:</span><span class="l2">SUPERKAUSI</span></h1>
    <p class="lede">Kolme vastaan kolme jäähallissa, jossa mikään ei pysy hallinnassa.</p>
    <div class="seg" id="modeSeg" role="group" aria-label="Pelitila">
      <button data-m="single" class="on">Yksittäispeli</button>
      <button data-m="season">Kausi</button>
      <button data-m="duo">Kaksinpeli</button>
      <button data-m="so">Voittolaukaukset</button>
    </div>
    <div class="seg" id="diffSeg" role="group" aria-label="Vaikeustaso">
      <button data-d="0">Helppo</button>
      <button data-d="1" class="on">Normaali</button>
      <button data-d="2">Vaikea</button>
    </div>
    <p id="modeNote" class="note hidden"></p>
    <div class="teamrow"><button id="teamA" class="tchip"></button><span class="vs">vs</span><button id="teamB" class="tchip"></button></div>
    <div class="seg settings" role="group" aria-label="Asetukset">
      <button id="optFollow"></button>
      <button id="optReplay"></button>
      <button id="optEvents">Tapahtumat</button>
      <button id="optQuality"></button>
      <button id="optMusic"></button>
      <button id="optAch">Saavutukset</button>
    </div>
    <button id="play" class="btn big">PELAA</button>
    <div class="keys" id="menuKeys"></div>
  </div>

  <div id="ach" class="overlay hidden">
    <p class="result small">SAAVUTUKSET</p>
    <p id="achCount" class="note"></p>
    <div id="achGrid" class="achgrid"></div>
    <button id="achBack" class="btn">VALMIS</button>
  </div>

  <div id="season" class="overlay hidden">
    <p class="result small">SUPERKAUSI</p>
    <div class="seg settings" id="seasonTabs" role="tablist" aria-label="Kausinäkymä">
      <button data-t="table" class="on">Sarjataulukko</button>
      <button data-t="scorers">Pörssit</button>
      <button data-t="round">Kierros</button>
      <button data-t="mine">Oma joukkue</button>
      <button data-t="cal">Kalenteri</button>
      <button data-t="teams">Joukkueet</button>
